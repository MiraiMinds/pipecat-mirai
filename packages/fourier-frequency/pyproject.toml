[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "fourier-frequency"
version = "0.8.0"
description = "Mirai's streaming text-to-speech and speech-to-text for any Python voice agent: Hindi, Hinglish, Gujarati and other Indian languages, with edge routing, warm sockets and reconnects built in"
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Sona Labs Pvt Ltd", email = "sneh.mehta@miraiminds.co" }]
requires-python = ">=3.11"
keywords = ["tts", "text-to-speech", "stt", "speech-to-text", "voice-agent", "websocket", "hindi", "telephony", "mirai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "httpx>=0.27,<1",
    "numpy>=1.26",
    "soxr>=0.3",
    "websockets>=13",
]

[project.urls]
Homepage = "https://github.com/MiraiMinds/pipecat-mirai/tree/main/packages/fourier-frequency"
Documentation = "https://docs.miraiminds.co"
Issues = "https://github.com/MiraiMinds/pipecat-mirai/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/fourier_frequency"]
