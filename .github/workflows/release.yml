name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check tag matches both versions
        run: |
          for project in pyproject.toml packages/fourier-frequency/pyproject.toml; do
            VERSION=$(grep -m1 '^version = ' $project | cut -d'"' -f2)
            test "v$VERSION" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$VERSION ($project)"; exit 1; }
          done
          grep -q "\"fourier-frequency==${GITHUB_REF_NAME#v}\"" pyproject.toml || { echo "pipecat-mirai must pin fourier-frequency==${GITHUB_REF_NAME#v}"; exit 1; }
      # Both packages, released together: pipecat-mirai X.Y.Z pins fourier-frequency X.Y.Z.
      - run: uv build --package fourier-frequency --out-dir dist
      - run: uv build --package pipecat-mirai --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing; no API token stored in GitHub
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md"
