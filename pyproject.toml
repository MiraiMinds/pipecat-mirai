[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pipecat-mirai"
version = "0.5.1"
description = "Mirai text-to-speech and Realtime API (Hindi, Hinglish, Gujarati) for Pipecat voice agents"
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Sona Labs Pvt Ltd", email = "sneh.mehta@miraiminds.co" }]
requires-python = ">=3.11"
keywords = ["pipecat", "tts", "text-to-speech", "voice-agent", "hindi", "telephony", "mirai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "pipecat-ai>=1.8.1,<2",
    "httpx>=0.27,<1",
    "numpy>=1.26",
    "soxr>=0.3",
    "websockets>=13",
]

[project.urls]
Homepage = "https://github.com/MiraiMinds/pipecat-mirai"
Documentation = "https://docs.miraiminds.co"
Issues = "https://github.com/MiraiMinds/pipecat-mirai/issues"

[dependency-groups]
dev = [
    "pipecat-ai[websocket]",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pipecat_mirai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
